name: Testit

on:
  push:
  workflow_dispatch: 

  permissions:
    contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Testi 1
        run: npm test -- test1 > test1.txt 2>&1 || true

      - name: Testi 2
        run: npm test -- test2 > testi2.txt 2>&1

      - name: Ilmoita virheestä
        if: failure()
        run: echo "Testit epäonnistuivat"
